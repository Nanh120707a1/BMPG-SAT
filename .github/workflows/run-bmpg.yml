name: Run BMPG-SAT

on:
  workflow_dispatch:

jobs:
  run-bmpg:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-sat

      - name: Run BMPG-SAT
        run: |
          python main.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bmpg-results
          path: results/